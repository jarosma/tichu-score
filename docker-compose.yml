services:
  frontend:
    build:
      context: tichu-frontend
      dockerfile: Dockerfile
      args:
        TICHU_PUBLIC_URL: ${TICHU_PUBLIC_URL:-}
        TICHU_API_BASE_URL: /api
    ports:
      - "81:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: tichu-backend
      dockerfile: src/main/Docker/Dockerfile.jvm
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: tichuuser
      QUARKUS_DATASOURCE_PASSWORD: tichupassword
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/tichu
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_CORS_ORIGINS: ${TICHU_CORS_ORIGINS:-http://localhost:81}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: tichu-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tichu
      POSTGRES_USER: tichuuser
      POSTGRES_PASSWORD: tichupassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tichuuser -d tichu"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tichu-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  tichu-db-data:
