%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=tichuuser
%dev.quarkus.datasource.password=tichupassword
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/tichu

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.mapping.format.global=ignore

quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=${TICHU_CORS_ORIGINS:http://localhost:5173}
%prod.quarkus.http.cors.origins=${TICHU_CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PATCH,DELETE
quarkus.http.cors.headers=Content-Type,Authorization
